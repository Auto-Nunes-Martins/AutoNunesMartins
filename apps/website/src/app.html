<!doctype html>
<html lang="pt-PT" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0B" />
    <script id="anm-gtm-consent" data-cookieconsent="ignore">
      (function () {
        var dataLayer = window.dataLayer = window.dataLayer || [];
        var loaded = false;
        var previous;

        function gtag() { dataLayer.push(arguments); }

        function consentCommand(action, value) {
          gtag('consent', action, {
            analytics_storage: value,
            ad_storage: value,
            ad_user_data: value,
            ad_personalization: value
          });
        }

        consentCommand('default', 'denied');

        function sync() {
          var cmp = window.Cookiebot;
          var consent = cmp && cmp.consent;
          var allowed = Boolean(cmp && cmp.hasResponse === true && consent &&
            consent.method === 'explicit' && consent.statistics === true && consent.marketing === true);
          if (allowed === previous) return;
          previous = allowed;
          consentCommand('update', allowed ? 'granted' : 'denied');

          if (!allowed) {
            // A loaded container can include third-party code. Reopen without it after withdrawal.
            if (loaded) window.location.reload();
            return;
          }
          if (loaded) return;
          loaded = true;
          dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
          var tag = document.createElement('script');
          tag.async = true;
          tag.setAttribute('data-cookieconsent', 'ignore');
          tag.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-W83CLHNR';
          document.head.appendChild(tag);
        }

        ['CookiebotOnConsentReady', 'CookiebotOnAccept', 'CookiebotOnDecline', 'pageshow']
          .forEach(function (event) { window.addEventListener(event, sync); });
        sync();
      })();
    </script>
    <script
      id="Cookiebot"
      src="https://consent.cookiebot.com/uc.js"
      data-cbid="df98b47d-50b5-4495-9371-0cd46914087d"
      data-blockingmode="auto"
      data-consentmode="disabled"
      type="text/javascript"
    ></script>
    <script id="orbit-theme-boot">
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('anm-orbit-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (_) { /* Use the default when local storage is unavailable. */ }
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0a0a0b' : '#f5f5f1');
      })();
    </script>
    <style>
      html { background: #0a0a0b; color-scheme: dark; }
      html[data-theme='light'] { background: #f5f5f1; color-scheme: light; }
    </style>
    <script id="orbit-startup">%anm.startup%</script>
    <style>
      html[data-orbit-restoring] {
        scroll-behavior: auto !important;
        overflow-anchor: none;
      }
      html[data-orbit-restoring] body {
        min-height: var(--orbit-restore-height, 0px);
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-code="hover" data-sveltekit-preload-data="off">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      window.initializeOrbitDocument();
    </script>
  </body>
</html>
